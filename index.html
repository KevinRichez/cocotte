<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F5F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FitMus" />
  <title>FitMus</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // Affiche les erreurs à l'écran (diagnostic sur téléphone, sans console).
    window.__fitmusErr = function (msg) {
      var el = document.getElementById('boot-error');
      if (!el) { el = document.createElement('pre'); el.id = 'boot-error'; el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:90px;z-index:999;background:#fff;border:1px solid #E8E6E0;border-radius:16px;padding:12px;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;color:#1E2A32;box-shadow:0 10px 40px rgba(0,0,0,.15)'; document.body.appendChild(el); }
      el.textContent = 'Oups, erreur de chargement :\n' + msg + '\n\n' + navigator.userAgent;
    };
    window.addEventListener('error', function (e) { window.__fitmusErr((e.message || 'Erreur') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { window.__fitmusErr(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    setTimeout(function () { var app = document.getElementById('app'); if (app && !app.children.length) window.__fitmusErr('L’app ne s’est pas lancée après 8 s (réseau vers unpkg.com ou navigateur trop ancien ?)'); }, 8000);
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://unpkg.com/preact@10.24.3/dist/preact.module.js",
      "preact/hooks": "https://unpkg.com/preact@10.24.3/hooks/dist/hooks.module.js",
      "htm": "https://unpkg.com/htm@3.1.1/dist/htm.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
